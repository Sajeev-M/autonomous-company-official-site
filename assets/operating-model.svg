355">Design &amp; build</text><text x="530" y="355">Connect &amp; coordinate</text></g><rect x="58" y="448" width="524" height="68" rx="5" fill="#191d2b" stroke="#756c98"/><text x="320" y="476" fill="#d6ccff" font-size="17">Independent security &amp; quality review</text><text x="320" y="498" fill="#b1c0c7" font-size="12">Inspect artifacts · challenge results · surface limits</text><text x="320" y="567" fill="#79ebd7" font-size="16">Owner review before consequential action</text></g></svg>